[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-agents"
version = "0.1.0"
description = "ORACLE: multi-agent enterprise data analyst (BigQuery SQL + document RAG) on Google Cloud"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-adk>=1.0.0",
  "google-genai>=1.0.0",
  "google-cloud-bigquery>=3.20.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "scikit-learn>=1.4",
  "numpy>=1.26",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
